# SDK contract test (A)(B)(C) calling workflow.
#
# This thin file lives in the SDK repository. The language-agnostic steps
# (fetch spec, start Prism, resolve the previous release tag) come from the
# central reusable repo saasus-platform/github-actions. The PHP-specific
# build/test steps stay here.
#
# What it checks:
#   (A) the SDK committed in this repository is syntactically valid and loadable
#   (B) the latest SDK's requests are accepted by the mock and responses deserialize
#   (C) the previously released SDK still deserializes responses from the latest spec
#
# Security:
#   - pull_request only (never pull_request_target); fork PRs do not receive secrets.
#   - the api read token is masked; no response body, spec body or PII is printed.
#   - third-party/official actions are pinned by commit SHA; keep it that way.

name: SDK Contract Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: sdk-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name "contract-test" is the required status check name. Do not rename.
  contract-test:
    name: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR (latest SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          tools: composer
          coverage: none

      - name: Set up Node (for Prism via npx)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Short-lived installation token (contents:read on the private api repo only).
      - name: Mint api read token
        id: api-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SPEC_READER_APP_ID }}
          private-key: ${{ secrets.SPEC_READER_PRIVATE_KEY }}
          owner: Anti-Pattern-Inc
          repositories: saasus-api

      # The api repository and its latest stable tag are resolved inside the action.
      - name: Fetch OpenAPI spec
        id: spec
        uses: saasus-platform/github-actions/.github/actions/fetch-openapi-spec@main
        with:
          token: ${{ steps.api-token.outputs.token }}

      # (A) Validate the generated code committed here (the released artifact);
      # re-generating would verify a different one. The pipeline
      # (spec -> generate.sh -> build) is already verified by the api
      # repository's "Update API Client" workflow when it opens its PR. PHP has
      # no compile step, so "build/type-check" is: install deps (which also
      # builds the autoloader for the committed classes), validate the manifest,
      # and lint every committed PHP file for syntax/type-declaration errors.
      - name: (A) Build SDK
        run: |
          set -euo pipefail
          composer validate --no-check-publish --no-check-all
          composer install --no-interaction --no-progress --prefer-dist
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "Syntax error in ${file}"
              php -l "$file" || true
              status=1
            fi
          done < <(find generated src test -name '*.php' -print0)
          exit $status

      # Static mode: responses come from the spec's examples, which is how the
      # spec makes oneOf responses resolvable. Dynamic mode would ignore them.
      - name: Start Prism mocks
        uses: saasus-platform/github-actions/.github/actions/setup-prism@main
        with:
          spec-dir: ${{ steps.spec.outputs.spec-dir }}
          modules: ${{ steps.spec.outputs.modules }}

      # (B) Latest SDK spec-compliance: requests accepted + responses
      # deserialize. The suite auto-enumerates every operation from the spec in
      # CONTRACT_SPEC_DIR and reads each module's mock URL from the
      # PRISM_URL_<MODULE> variables exported above.
      - name: (B) Latest SDK contract
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          # The latest SDK must cover every spec operation.
          CONTRACT_REQUIRE_COMPLETE: "true"
        run: vendor/bin/phpunit -c test/phpunit.contract.xml --log-junit "$PWD/contract-junit-latest.xml"

      - name: Resolve previous SDK stable tag
        id: old-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@main

      - name: Checkout old SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.old-tag.outputs.tag }}
          path: old-sdk

      # (C) Forward compatibility: the previously released SDK must still
      # round-trip against the LATEST spec. The old tag's OWN bundled suite is
      # run (the current one is not copied into it), so each release is checked
      # with the test it shipped with. Prism was started above from the latest
      # spec, and CONTRACT_SPEC_DIR points at that spec.
      #
      # A tag published before the suite existed has no
      # test/phpunit.contract.xml; PHPUnit then fails on the missing config by
      # design, there is no skip mechanism.
      - name: (C) Old SDK forward-compat (bundled suite)
        working-directory: old-sdk
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit -c test/phpunit.contract.xml --log-junit "$PWD/contract-junit-old.xml"

      # Keep the JUnit reports of both the latest SDK (B) and the old SDK (C) as
      # evidence: each case (operation + body variant + result) is in the names.
      # Our failure messages carry only operation id and HTTP status, never a
      # response body.
      - name: Upload JUnit contract reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-test-reports
          path: |
            contract-junit-latest.xml
            old-sdk/contract-junit-old.xml
          if-no-files-found: ignore
