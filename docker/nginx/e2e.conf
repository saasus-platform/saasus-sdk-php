server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # カバレッジレポート
    location /coverage/ {
        alias /usr/share/nginx/html/coverage/;
        try_files $uri $uri/ =404;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # テスト結果
    location /results/ {
        alias /usr/share/nginx/html/results/;
        try_files $uri $uri/ =404;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # ルートページ
    location / {
        return 200 '
<!DOCTYPE html>
<html>
<head>
    <title>SaaSus SDK E2E Test Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 20px 0; }
        .card h2 { margin-top: 0; color: #333; }
        .link { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; margin: 5px; }
        .link:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SaaSus SDK for PHP - E2E Test Results</h1>
        
        <div class="card">
            <h2>📊 カバレッジレポート</h2>
            <p>E2Eテストのコードカバレッジレポートを確認できます。</p>
            <a href="/coverage/" class="link">カバレッジレポートを見る</a>
        </div>
        
        <div class="card">
            <h2>📋 テスト結果</h2>
            <p>E2Eテストの実行結果とログを確認できます。</p>
            <a href="/results/" class="link">テスト結果を見る</a>
        </div>
        
        <div class="card">
            <h2>🚀 テスト実行方法</h2>
            <p>以下のコマンドでE2Eテストを実行できます：</p>
            <pre style="background: #f8f9fa; padding: 15px; border-radius: 4px;">
# Docker環境でE2Eテストを実行
./scripts/run-e2e-docker.sh

# 特定のテストグループのみ実行
./scripts/run-e2e-docker.sh tenant-crud

# カバレッジレポート付きで実行
./scripts/run-e2e-docker.sh -c auth
            </pre>
        </div>
    </div>
</body>
</html>
        ';
        add_header Content-Type text/html;
    }

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ログ設定
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}